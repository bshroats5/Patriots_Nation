---
layout: null
---
<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
{% include head.html %}
</head>
<body>

  <header class="site-header">
    <nav>
      <a class="logo" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
        <img src="{{ '/images/PN_Logo.png' | relative_url }}" alt="{{ site.title }}">
      </a>

      <ul>
        <li><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a></li>
        <li><a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog' %}class="active"{% endif %}>Blog</a></li>
        <li><a href="{{ '/events/' | relative_url }}" {% if page.url == '/events/' %}class="active"{% endif %}>Events</a></li>
        <li><a href="{{ '/contact/' | relative_url }}" {% if page.url == '/contact/' %}class="active"{% endif %}>Contact</a></li>
      </ul>

      <button class="mobile-menu-toggle" type="button" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </nav>
  </header>

  {{ content }}

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <p class="wordmark">{{ site.title }}</p>
        <p class="rail">{{ site.tagline }}</p>
      </div>
      <p class="disclaimer">{{ site.description }}</p>
      {% include social.html compact=true %}
    </div>
  </footer>

  <button class="back-to-top" type="button" aria-label="Back to top">&uarr;</button>

  <script src="{{ '/assets/js/scripts.js' | relative_url }}"></script>
</body>
</html>
