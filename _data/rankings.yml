# Patriots Nation: NAIA National Rankings
# Update this list whenever a new poll drops. Only include sports that
# are currently ranked; delete or comment out ones that fall out.
#
# Required: sport, rank, poll. An entry missing "sport" is skipped
# entirely rather than showing a blank card.
# Optional: gender, record, poll_url. Safe to leave blank ("").
#
# Format rules (a mistake here stops the whole site from building):
#   - Every entry starts with "- " at the very left edge, no spaces before it.
#   - The fields underneath are indented exactly 2 spaces.
#   - Every opening quote needs a closing quote.
#
# Fields:
#   sport      - Display name, e.g. "Volleyball" or "Soccer"
#   gender     - "Men's", "Women's", or "" (leave blank for co-ed sports)
#   rank       - Current national rank (number only, no # sign), or "RV"
#   poll       - Name of the poll, e.g. "NAIA Coaches' Poll"
#   record     - Optional current record, e.g. "27-0"
#   poll_url   - Optional link to the official poll page

- sport: "Volleyball"
  gender: "Women's"
  rank: 25
  poll: "NAIA Coaches' Poll"
  record: "23-4"
  poll_url: "https://www.naia.org/sports/womens-volleyball/polls/"

