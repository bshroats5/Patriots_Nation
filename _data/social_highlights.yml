# Patriots Nation — Manually-updated social highlights
# Instagram, Threads, and Reddit don't offer a free auto-updating feed
# embed, so update these by hand whenever you post something new.
#
# Required: platform, url — an entry missing "url" is skipped entirely.
# If "image" is left blank, the site logo is shown instead of a broken
# image icon, so it's always safe to leave blank while you find a screenshot.
#
# Fields:
#   platform - "Instagram", "Threads", or "Reddit"
#   url      - Link to the actual post
#   image    - Path to a thumbnail/screenshot, e.g. /images/2026/whatever.jpg
#   caption  - Short caption/summary of the post
#   date     - Display date, e.g. "Aug 12, 2026"

- platform: "Instagram"
  url: "https://instagram.com/ucpatriotsnation"
  image: ""
  caption: "Replace this with your latest Instagram post's screenshot and caption."
  date: ""

- platform: "Threads"
  url: "https://www.threads.net/@ucpatriotsnation"
  image: ""
  caption: "Replace this with your latest Threads post's screenshot and caption."
  date: ""

- platform: "Reddit"
  url: "https://www.reddit.com/r/CumberlandsPatriots"
  image: ""
  caption: "Replace this with your latest Reddit post's screenshot and caption."
  date: ""
